version: '3'

silent: true

vars:
  NAME: simple-blink
  MCU: atmega328p           # the chip on the Arduino Uno
  F_CPU: 16000000UL         # Uno clock speed (16 MHz): the baud and timer math, and _delay_ms(), need it
  BAUD_RATE: 9600           # serial speed: compiled into the firmware as BAUD_RATE, and used by `task monitor`
  CALLBACKS_TIME_CAPACITY: 4  # most timed callbacks pending at once (1 to 255); each slot costs ~16 bytes of RAM
  CALLBACKS_TIME_MAX_CAPACITY: 255  # the library's limit; `task test` also runs at this size
  FRONTEND_DIR: frontend
  MONITOR_PORT: 8765        # localhost port the browser serial monitor is served on
  SRC_DIR: src
  TEST_DIR: test
  BUILD_DIR: build
  # Compiler flags shared by the real build AND the editor (.clangd) — change them here only
  # Strict warnings: -Wpedantic flags anything that isn't standard C23, -Wconversion flags
  # silent narrowing (e.g. a uint16_t squeezed into a uint8_t), and -Wshadow flags a
  # variable that hides another of the same name.
  CFLAGS_COMMON: >-
    -std=c23
    -mmcu={{.MCU}}
    -DF_CPU={{.F_CPU}}
    -DBAUD_RATE={{.BAUD_RATE}}
    -DCALLBACKS_TIME_CAPACITY={{.CALLBACKS_TIME_CAPACITY}}
    -Wall -Wextra -Wpedantic -Wconversion -Wshadow
    -ffunction-sections -fdata-sections
  OPT_RELEASE: -Os          # smallest/fastest code
  OPT_DEBUG: -Og -g3        # easier to step through
  # Unit tests run on this Mac, not the chip, so they use the Mac's own clang.
  # The sanitizers stop the test with a report on out-of-bounds access, overflow, etc.
  # The same strict warnings as the firmware build (see CFLAGS_COMMON).
  # CALLBACKS_TIME_CAPACITY isn't here: test:run adds it, since the tests run at more than
  # one capacity.
  HOST_CFLAGS: >-
    -std=c23
    -Wall -Wextra -Wpedantic -Wconversion -Wshadow
    -g -fno-omit-frame-pointer
    -fsanitize=address,undefined

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile firmware → build/<mode>/simple-blink.hex  (MODE=debug for a debug build)
    label: 'build-{{.MODE}}'    # separate up-to-date tracking per mode
    deps: [clangd]              # keep editor config in sync with these flags
    vars:
      MODE: '{{.MODE | default "release"}}'   # release | debug
      # release = smallest/fastest code, debug = easier to step through
      OPT: '{{if eq .MODE "debug"}}{{.OPT_DEBUG}}{{else}}{{.OPT_RELEASE}}{{end}}'
      OUT_DIR: '{{.BUILD_DIR}}/{{.MODE}}'
      # -flto (link-time optimization): optimize the whole program at once instead of one
      # .c file at a time, so small functions can be inlined across files. Smaller code,
      # and cheaper ISRs: they needn't save extra registers for calls they can't see into.
      CFLAGS: '{{.CFLAGS_COMMON}} {{.OPT}} -flto'
      # --gc-sections: the linker drops every function and variable nothing uses. It works
      # with -ffunction-sections -fdata-sections (in CFLAGS_COMMON), which put each one in
      # its own section so it can be dropped on its own. LTO already removes most unused
      # code from our files; this also catches what LTO can't see, such as library code.
      LDFLAGS: -Wl,--gc-sections
    sources:
      - '{{.SRC_DIR}}/**/*.c'
      - '{{.SRC_DIR}}/**/*.h'
      - Taskfile.yml
    generates:
      - '{{.OUT_DIR}}/{{.NAME}}.hex'
    preconditions:
      - sh: '[ -n "$(find {{.SRC_DIR}} -name "*.c")" ]'
        msg: 'No .c files found in {{.SRC_DIR}}/ — create {{.SRC_DIR}}/main.c first'
    cmds:
      - mkdir -p {{.OUT_DIR}}
      # 1. compile + link every .c file under src/, including subfolders like src/common/,
      #    into an ELF (has debug info, symbols, etc.). -I src lets any file include
      #    another by its path from src/, e.g. #include "lib/hardware/gpio.h".
      - avr-gcc {{.CFLAGS}} {{.LDFLAGS}} -I {{.SRC_DIR}} $(find {{.SRC_DIR}} -name '*.c' | sort) -o {{.OUT_DIR}}/{{.NAME}}.elf
      # 2. extract just the program bytes as Intel HEX — what SimulIDE / the chip loads
      - avr-objcopy -O ihex -R .eeprom {{.OUT_DIR}}/{{.NAME}}.elf {{.OUT_DIR}}/{{.NAME}}.hex
      # 3. show how much flash/RAM we use
      - avr-size -C --mcu={{.MCU}} {{.OUT_DIR}}/{{.NAME}}.elf

  debug:
    desc: Debug build (-Og -g3) → build/debug/
    cmds:
      - task: build
        vars: { MODE: debug }

  dev:
    desc: Watch src/ and rebuild on every save (then reload firmware in SimulIDE) (needs watchexec)
    preconditions:
      - sh: command -v watchexec
        msg: 'watchexec not found — install it with: brew install watchexec'
    cmds:
      # Same watcher as test:watch; see the note there
      - >-
        watchexec --clear --on-busy-update=queue
        --watch {{.SRC_DIR}} --exts c,h
        -- task build

  flash:
    desc: Build and upload to the Uno over USB  (UNO_PORT=/dev/cu.xxx to pick the port)
    preconditions:
      - sh: command -v avrdude
        msg: 'avrdude not found — install it with: brew install avrdude'
    cmds:
      - task: build
        vars: { MODE: release }
      # Finds the Uno by its USB ID, since the port name changes between sockets.
      # (avrdude can't do this itself: Homebrew builds it without libserialport.)
      # It's UNO_PORT, not PORT, because Task also reads env vars and PORT is a common one.
      - |
        port=$(scripts/find-uno-port.sh '{{.UNO_PORT}}') || exit 1
        echo "Flashing Uno on $port"
        avrdude -c arduino -p m328p -P "$port" -b 115200 -U flash:w:{{.BUILD_DIR}}/release/{{.NAME}}.hex:i

  monitor:
    desc: Open the serial monitor in the browser (Chrome, Edge or Brave); Ctrl-C stops it
    interactive: true           # so Ctrl-C reaches the server
    vars:
      URL: 'http://127.0.0.1:{{.MONITOR_PORT}}/?baud={{.BAUD_RATE}}'
    preconditions:
      - sh: '! lsof -nP -iTCP:{{.MONITOR_PORT}} -sTCP:LISTEN >/dev/null 2>&1'
        msg: 'Port {{.MONITOR_PORT}} is already in use (another monitor still running?). Pick another: task monitor MONITOR_PORT=8766'
    cmds:
      # WebSerial only works on secure pages: https://, or http:// from this computer
      # (127.0.0.1 / localhost). Python's built-in server is enough for static files.
      # The browser opens a second after the server starts. WebSerial needs a
      # Chromium browser, so prefer one of those over the system default.
      - |
        echo "Serial monitor: {{.URL}}  (Ctrl-C to stop)"
        (
          sleep 1
          for app in "Google Chrome" "Microsoft Edge" "Brave Browser" "Chromium"; do
            open -a "$app" "{{.URL}}" 2>/dev/null && exit 0
          done
          open "{{.URL}}"
        ) &
        python3 -m http.server {{.MONITOR_PORT}} --bind 127.0.0.1 --directory {{.FRONTEND_DIR}}

  monitor:terminal:
    desc: Show the Uno's serial output in this terminal (quit with Ctrl-A, then K, then Y)
    interactive: true           # screen needs the real terminal, not Task's output capture
    cmds:
      - |
        port=$(scripts/find-uno-port.sh '{{.UNO_PORT}}') || exit 1
        echo "Opening $port at {{.BAUD_RATE}} baud: quit with Ctrl-A, then K, then Y"
        echo "(Opening the port resets the Uno, so it starts again from the top.)"
        sleep 1
        screen "$port" {{.BAUD_RATE}}

  test:
    desc: Run the unit tests on this Mac (lib/callbacks/time again at its maximum capacity)
    deps: [clangd]
    preconditions:
      - sh: '[ -n "$(find {{.TEST_DIR}} -name "*_test.c")" ]'
        msg: 'No tests found — create {{.TEST_DIR}}/<path>_test.c first (e.g. {{.TEST_DIR}}/lib/math/utils_test.c)'
    cmds:
      # Every test, at the CALLBACKS_TIME_CAPACITY the firmware uses
      - task: test:run
        vars:
          CAPACITY: '{{.CALLBACKS_TIME_CAPACITY}}'
      # Then the callbacks tests again at the largest capacity the library allows: too big
      # for the Uno's RAM, but it checks the library is right at its limit. (Skipped if the
      # first run failed.)
      - task: test:run
        vars:
          CAPACITY: '{{.CALLBACKS_TIME_MAX_CAPACITY}}'
          TESTS: lib/callbacks/time

  test:run:
    internal: true # only called by `test`, not listed in `task --list`
    label: 'test:run-{{.CAPACITY}}-{{.TESTS}}'
    vars:
      # Which test to run, by its path under test/ without _test.c (e.g. lib/callbacks/time).
      # Empty runs them all.
      TESTS: '{{.TESTS | default ""}}'
      OUT_DIR: '{{.BUILD_DIR}}/test/capacity-{{.CAPACITY}}'
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - echo "Tests with CALLBACKS_TIME_CAPACITY={{.CAPACITY}}"
      # Each test is its own program. test/<path>_test.c tests src/<path>.c (so
      # test/lib/callbacks/time_test.c tests src/lib/callbacks/time.c): compile the two
      # together, run it, and carry on to the next one even if it fails, so you see every
      # result.
      - |
        failed=0
        if [ -n "{{.TESTS}}" ]; then
          test_files="{{.TEST_DIR}}/{{.TESTS}}_test.c"
        else
          test_files=$(find {{.TEST_DIR}} -name '*_test.c' | sort)
        fi
        for test_file in $test_files; do
          name=${test_file#{{.TEST_DIR}}/}
          name=${name%_test.c}
          exe={{.OUT_DIR}}/$(echo "$name" | tr / _)_test
          echo "── $name"
          src_file={{.SRC_DIR}}/$name.c
          if [ ! -f "$src_file" ]; then
            echo "   $test_file has no matching $src_file"
            echo "   FAILED"
            failed=$((failed + 1))
            continue
          fi
          # Also link every lib/ file that doesn't touch the hardware (no <avr/...> or
          # <util/...> include), so code that uses other lib/ code can be tested too:
          # callbacks/time.c needs collections/handle.c and collections/time_heap.c, for
          # example. -dead_strip: the linker drops code the test never reaches. Some of these
          # files call hardware code (input/switch.c calls hardware/gpio.c), which can't be
          # linked on the Mac; that's fine as long as the test doesn't use them. If it does,
          # linking fails.
          libs=$(find {{.SRC_DIR}}/lib -name '*.c' | sort | xargs grep -L -E '#include <(avr|util)/' | grep -v -x "$src_file")
          if xcrun clang {{.HOST_CFLAGS}} -DCALLBACKS_TIME_CAPACITY={{.CAPACITY}} -I {{.SRC_DIR}} \
               "$test_file" "$src_file" $libs -Wl,-dead_strip -o "$exe" && "$exe"; then
            echo "   passed"
          else
            echo "   FAILED"
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "$failed test file(s) failed"
          exit 1
        fi

  test:watch:
    desc: Re-run the unit tests every time a file in src/ or test/ changes (needs watchexec)
    preconditions:
      - sh: command -v watchexec
        msg: 'watchexec not found — install it with: brew install watchexec'
    cmds:
      # watchexec instead of Task's own `watch: true`, which runs several overlapping
      # times per save. --clear starts each run on a clean screen; --on-busy-update=queue
      # lets a running test finish before the next one starts.
      - >-
        watchexec --clear --on-busy-update=queue
        --watch {{.SRC_DIR}} --watch {{.TEST_DIR}} --exts c,h
        -- task test

  fmt:
    desc: Format all C files in src/ and test/ (style lives in .clang-format)
    cmds:
      # xcrun finds the clang-format bundled with Xcode, which isn't on PATH
      # --verbose lists each file, since this Taskfile is otherwise silent
      - find {{.SRC_DIR}} {{.TEST_DIR}} -type f \( -name '*.c' -o -name '*.h' \) -exec xcrun clang-format -i --verbose {} +

  clangd:
    desc: Generate .clangd and compile_commands.json so your editor understands src/ and test/
    silent: true                # behind-the-scenes helper: don't print its script or "up to date"
    sources:
      - Taskfile.yml
      # re-run when a .c file is added, so it's listed in compile_commands.json
      - '{{.SRC_DIR}}/**/*.c'
      - '{{.TEST_DIR}}/**/*.c'
    generates:
      - .clangd
      - compile_commands.json
    cmds:
      # compile_commands.json lists every .c file, so clangd indexes them all in the
      # background. Without it, go-to-definition only finds code in files you have open
      # and stops at the declaration in the .h. The real flags come from .clangd (below),
      # so each entry only needs the file name.
      - |
        {
          echo "["
          sep=""
          find "$(realpath .)/{{.SRC_DIR}}" "$(realpath .)/{{.TEST_DIR}}" -type f -name '*.c' | sort | while read -r f; do
            printf '%s  {"directory": "%s", "file": "%s", "arguments": ["clang", "-c", "%s"]}' "$sep" "$(realpath .)" "$f" "$f"
            sep=$',\n'
          done
          echo
          echo "]"
        } > compile_commands.json
      - |
        {
          echo "# Generated by 'task clangd' — do not edit by hand."
          echo "# Tells clangd (editor autocomplete/errors) how each file is compiled."
          echo "# Each section between '---' lines applies to the paths in its If: block."
          echo
          echo "# test/ runs on this Mac: the Mac's own headers, plus src/ for the code under test"
          echo "If:"
          echo "  PathMatch: {{.TEST_DIR}}/.*"
          echo "CompileFlags:"
          echo "  Add:"
          for f in -xc {{.HOST_CFLAGS}} -DCALLBACKS_TIME_CAPACITY={{.CALLBACKS_TIME_CAPACITY}} -isysroot"$(xcrun --show-sdk-path)" -I"$(realpath {{.SRC_DIR}})"; do
            echo "    - $f"
          done
          echo "---"
          echo "# Everything else runs on the chip: parse it the way avr-gcc compiles it"
          echo "If:"
          echo "  PathExclude: {{.TEST_DIR}}/.*"
          echo "CompileFlags:"
          echo "  Add:"
          # --target=avr: clang's name for the AVR chip family
          # -xc: treat every file (including .h headers) as C, not C++
          # -nostdinc: don't use the Mac's headers, only avr-gcc's (added below)
          # -I src: same include path as the build, so "lib/hardware/gpio.h" resolves
          for f in --target=avr -xc {{.CFLAGS_COMMON}} {{.OPT_RELEASE}} -nostdinc -I"$(realpath {{.SRC_DIR}})"; do
            echo "    - $f"
          done
          # avr-gcc defines a few macros clang doesn't; avr-libc needs them
          echo | avr-gcc -mmcu={{.MCU}} -dM -E -xc - | grep -oE '__AVR_(HAVE_SPH|SP8)__' | while read -r m; do
            echo "    - -D$m"
          done
          # use avr-gcc's own header folders (where avr/io.h lives)
          echo | avr-gcc -mmcu={{.MCU}} -xc -E -v - 2>&1 | sed -n '/#include <...>/,/End of search/{/^ /p;}' | while read -r p; do
            echo "    - -isystem$(realpath "$p")"
          done
        } > .clangd

  clean:
    desc: Delete build output
    cmds:
      - rm -rf {{.BUILD_DIR}}
